<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Medical Cross Accent (Subtle Soft Emerald Tint) -->
  <rect x="27" y="10" width="10" height="44" rx="5" fill="#10b981" fill-opacity="0.15" />
  <rect x="10" y="27" width="44" height="10" rx="5" fill="#10b981" fill-opacity="0.15" />

  <!-- Stylized Veterinary Paw Pad -->
  <path d="M 23 37 C 23 32, 41 32, 41 37 C 41 43, 37 46, 32 46 C 27 46, 23 43, 23 37 Z" fill="url(#emeraldGrad)" filter="url(#glow)" />

  <!-- 4 Toe Beans -->
  <ellipse cx="20" cy="28" rx="3.5" ry="5" fill="#10b981" transform="rotate(-20 20 28)" />
  <ellipse cx="28" cy="23" rx="3.5" ry="5.5" fill="#059669" transform="rotate(-6 28 23)" />
  <ellipse cx="36" cy="23" rx="3.5" ry="5.5" fill="#059669" transform="rotate(6 36 23)" />
  <ellipse cx="44" cy="28" rx="3.5" ry="5" fill="#10b981" transform="rotate(20 44 28)" />

  <!-- Heart Pulse / Life Rhythm Line Accent -->
  <path d="M 10 49 L 21 49 L 25 43 L 29 53 L 34 45 L 37 49 L 54 49" fill="none" stroke="#047857" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
</svg>
