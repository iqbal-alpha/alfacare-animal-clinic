<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071220" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container with soft shadow and border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Medical Cross Base -->
  <rect x="26" y="12" width="12" height="40" rx="4" fill="#ffffff" fill-opacity="0.12" />
  <rect x="12" y="26" width="40" height="12" rx="4" fill="#ffffff" fill-opacity="0.12" />

  <!-- Stylized Animal Paw (Veterinary Symbol) -->
  <!-- Main Paw Pad -->
  <path d="M 23 37 C 23 32, 41 32, 41 37 C 41 43, 37 46, 32 46 C 27 46, 23 43, 23 37 Z" fill="url(#emeraldGrad)" filter="url(#glow)" />

  <!-- 4 Toe Beans -->
  <ellipse cx="20" cy="28" rx="3.5" ry="5" fill="#34d399" transform="rotate(-20 20 28)" />
  <ellipse cx="28" cy="23" rx="3.5" ry="5.5" fill="#34d399" transform="rotate(-6 28 23)" />
  <ellipse cx="36" cy="23" rx="3.5" ry="5.5" fill="#34d399" transform="rotate(6 36 23)" />
  <ellipse cx="44" cy="28" rx="3.5" ry="5" fill="#34d399" transform="rotate(20 44 28)" />

  <!-- Heart Pulse / Life Rhythm Line Accent -->
  <path d="M 12 48 L 22 48 L 26 42 L 30 52 L 35 44 L 38 48 L 52 48" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
